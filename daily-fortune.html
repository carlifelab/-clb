<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>今日の運勢｜12星座占い | Moonlight Sign</title><meta name="description" content="12星座から今日の総合運・恋愛運・金運・仕事運をチェック。毎日楽しめる星座占い。"><link rel="canonical" href="https://carlifelab.github.io/-clb/daily-fortune.html"><style>
:root{--gold:#d9b86c;--muted:#c2bdd2;--line:rgba(217,184,108,.25)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#30234b,#11101d 65%);color:#f6f0e4;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.8}header{text-align:center;padding:28px 15px;border-bottom:1px solid var(--line)}header a{color:var(--gold);text-decoration:none;letter-spacing:.12em;font-size:1.35rem}main{max-width:760px;margin:30px auto;padding:0 18px}h1,h2{color:var(--gold);font-weight:normal}h1{font-size:1.65rem}.lead{color:var(--muted)}select,button{font:inherit;border-radius:9px;padding:12px;border:1px solid var(--line)}select{background:#211c35;color:#fff;width:100%;margin:8px 0 14px}button{background:linear-gradient(110deg,#d9b86c,#f1d99b);color:#211a2d;border:0;font-weight:bold;width:100%;cursor:pointer}.panel{background:#1d1a30;border:1px solid var(--line);border-radius:14px;padding:22px;margin:18px 0}.result{display:none}.date{color:var(--muted);font-size:.85rem}.score{font-size:2rem;color:var(--gold)}.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.scorebox{background:#29233f;padding:12px;border-radius:10px}.scorebox strong{display:block;color:var(--gold)}.back{color:var(--gold)}footer{text-align:center;color:#928ba5;padding:25px;font-size:.8rem}
</style></head><body><header><a href="index.html">Moonlight Sign</a></header><main><p><a class="back" href="index.html">← ホームへ戻る</a></p><h1>🌙 今日の12星座占い</h1><p class="lead">星座を選んで、今日を前向きに過ごすヒントを受け取りましょう。</p><section class="panel"><label for="sign">あなたの星座</label><select id="sign"><option value="">星座を選択してください</option><option>牡羊座</option><option>牡牛座</option><option>双子座</option><option>蟹座</option><option>獅子座</option><option>乙女座</option><option>天秤座</option><option>蠍座</option><option>射手座</option><option>山羊座</option><option>水瓶座</option><option>魚座</option></select><button id="show">今日の運勢を見る</button></section><section class="panel result" id="result" aria-live="polite"><div class="date" id="today"></div><h2 id="heading"></h2><div class="score" id="total"></div><div class="scores"><div class="scorebox"><strong>恋愛運</strong><span id="love"></span></div><div class="scorebox"><strong>金運</strong><span id="money"></span></div><div class="scorebox"><strong>仕事運</strong><span id="work"></span></div><div class="scorebox"><strong>ラッキーカラー</strong><span id="color"></span></div></div><h2>今日のメッセージ</h2><p id="message"></p><p class="date">※日付と星座をもとに表示する、娯楽としての占いです。未来や結果を保証するものではありません。</p></section></main><footer>© 2026 Moonlight Sign</footer><script>
const signs=["牡羊座","牡牛座","双子座","蟹座","獅子座","乙女座","天秤座","蠍座","射手座","山羊座","水瓶座","魚座"];
const colors=["月白","ラベンダー","シャンパンゴールド","ミッドナイトブルー","ローズ","ミントグリーン","アメジスト","パールホワイト"];
const messages=["小さな一歩が流れを変える日。気になっていたことを一つだけ始めてみて。","人との会話にヒントがありそう。相手の話を最後まで聞くことを意識して。","身の回りを整えると気持ちもすっきり。机やバッグの中を整理してみよう。","焦らず自分のペースを守って。丁寧に選ぶことが良い結果につながりそう。","新しい視点を取り入れるチャンス。いつもと違う方法を試してみて。","頑張りすぎず、休む時間も大切に。余白をつくることで発想が広がりそう。","感謝を言葉にしてみよう。何気ない一言が関係を温かくしてくれそう。","情報を整理してから行動すると安心。大切な決断は条件を確認して。"];
function seed(s){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()+signs.indexOf(s)*37}
document.getElementById("show").addEventListener("click",()=>{const s=document.getElementById("sign").value;if(!s){alert("星座を選んでください");return}let n=seed(s);const rnd=()=>{n=(n*9301+49297)%233280;return n/233280};const score=()=>Math.floor(65+rnd()*36);const total=score(),love=score(),money=score(),work=score();const d=new Date();document.getElementById("today").textContent=d.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"long"});document.getElementById("heading").textContent=s+"の運勢";document.getElementById("total").textContent="総合運 "+total+"点";document.getElementById("love").textContent=love+"点";document.getElementById("money").textContent=money+"点";document.getElementById("work").textContent=work+"点";document.getElementById("color").textContent=colors[Math.floor(rnd()*colors.length)];document.getElementById("message").textContent=messages[Math.floor(rnd()*messages.length)];document.getElementById("result").style.display="block";document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"})});
</script></body></html>
